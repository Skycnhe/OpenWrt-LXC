name: Robust OpenWrt Build (ARM64 / X86)

on:
  workflow_dispatch:
    inputs:
      arch_choice:
        description: '选择固件架构 (Target Architecture)'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - 'x86_64'      # X86 64位 (软路由、虚拟机、传统电脑 PC)
          - 'arm64'       # ARM64 (armvirt/64 - 适用于传统虚拟机、LXC 容器、N1等盒子打包)
          - 'armv8'       # ARMv8 (armsr/armv8 SystemReady - 适用于树莓派4/5、新型物理机)
      repo_choice:
        description: '选择固件源码 (Firmware Source / Codebase)'
        required: true
        default: 'official'
        type: choice
        options:
          - 'official'     # 官方标准 OpenWrt
          - 'immortalwrt'  # 衍生天灵源 (国内环境驱动及开箱即用体验较好)
          - 'lede'         # Lean 的 LEDE 源 (国内极常用，插件支持全面)
          - 'lienol'       # Lienol 的精简改版源
      repo_branch:
        description: '源码分支 (Branch - 官方/天灵推荐 openwrt-24.10; Lean/Lienol 会自动纠错为对应可用分支)'
        required: true
        default: 'openwrt-24.10'
        type: string
      feed_choice:
        description: '选择软件包源 (Package Feed / 决定能搜到哪些插件)'
        required: true
        default: 'default'
        type: choice
        options:
          - 'default'      # 仅使用源码自带的 feeds
          - 'kenzok8'      # 额外注入 Kenzok8 常用包合集源 (含有丰富特色插件)
      firmware_format:
        description: '固件生成格式 (Output Format)'
        required: true
        default: 'both'
        type: choice
        options:
          - 'both'         # 同时输出 LXC 容器包与 KVM 虚拟机镜像
          - 'rootfs_only'  # 仅输出 LXC 容器包 (tar.gz)
          - 'efi_only'     # 仅输出 KVM 虚拟机 EFI 镜像 (img.gz)
      include_luci:
        description: '包含 LuCI 网页后台 (Include Web UI)'
        required: true
        default: true
        type: boolean
      plugin_choices:
        description: '选择预装精品插件 (支持多选，空格分隔。不想要的插件直接删掉其名字即可)'
        required: false
        default: 'clashoo openclash passwall mosdns argon'
        type: string
      custom_packages:
        description: '输入其他自定义安装包 (空格分隔，例如: luci-app-ttyd luci-app-upnp)'
        required: false
        default: 'luci-theme-argon'
        type: string
      root_password:
        description: '自定义 Root 初始密码 (Default Root Password)'
        required: true
        default: 'admin'
        type: string
      enable_cache:
        description: '启用编译下载缓存 (利用 GitHub 缓存提升后续编译速度)'
        required: true
        default: true
        type: boolean
      is_bypass_router:
        description: '是否一键配置为旁路由模式 (是: 关闭DHCP/ ra通告, 设置网关及DNS)'
        required: true
        default: false
        type: boolean
      lan_ip:
        description: 'LAN 口自定义 IP 地址 (例如: 192.168.1.253)'
        required: true
        default: '192.168.1.253'
        type: string
      lan_gateway:
        description: '网关 IP 地址 (主路由的 IP，仅在开启旁路由模式下生效)'
        required: true
        default: '192.168.1.1'
        type: string
      lan_dns:
        description: 'DNS 服务器 (空格分隔，仅在开启旁路由模式下生效)'
        required: true
        default: '223.5.5.5 114.114.114.114'
        type: string

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        # 深度清理磁盘，额外释放大约 20GB+ 空间，防止在大规模并发编译时耗尽空间导致崩溃
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache /usr/local/share/boost
        sudo docker image prune --all --force
        sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
        sudo apt-get autoremove --purge -y
        sudo apt-get clean
        df -h

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-pyelftools qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip xmlto xz-utils zlib1g-dev python3-setuptools python3-jinja2 python3-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Resolve Source Repository
      run: |
        CHOICE="${{ github.event.inputs.repo_choice }}"
        BRANCH="${{ github.event.inputs.repo_branch }}"
        
        if [ "$CHOICE" = "official" ]; then
          echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
          echo "REPO_BRANCH=$BRANCH" >> $GITHUB_ENV
        elif [ "$CHOICE" = "immortalwrt" ]; then
          echo "REPO_URL=https://github.com/immortalwrt/immortalwrt" >> $GITHUB_ENV
          echo "REPO_BRANCH=$BRANCH" >> $GITHUB_ENV
        elif [ "$CHOICE" = "lede" ]; then
          echo "REPO_URL=https://github.com/coolsnowwolf/lede" >> $GITHUB_ENV
          echo "REPO_BRANCH=master" >> $GITHUB_ENV
          echo "::warning::Lean 的 LEDE 源码仅支持 'master' 分支。已自动强制修正为 'master' 防止编译报错。"
        elif [ "$CHOICE" = "lienol" ]; then
          echo "REPO_URL=https://github.com/Lienol/openwrt" >> $GITHUB_ENV
          echo "REPO_BRANCH=main" >> $GITHUB_ENV
          echo "::warning::Lienol 源码推荐使用 'main' 分支。已自动强制修正为 'main' 防止编译报错。"
        fi

    - name: Clone source code
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        
        # 🚀 核心修复：强力破除 APK 打包器对非空 CONTROL 文件夹报错拦截的限制
        if [ -f include/package-pack.mk ]; then
          echo "正在应用 package-pack.mk 兼容性补丁以规避 CONTROL 校验失败报错..."
          sed -i '/is not empty! This is not right and should be checked!/{n;s/exit 1/rm -rf $$(IDIR_$(1))\/CONTROL/}' include/package-pack.mk
        fi

    # 🚀 新增：利用 GitHub Cache 机制缓存源码下载目录 /dl，防止因上游下载源不稳定导致的报错并大幅度加快二次构建速度
    - name: Cache download directory
      if: github.event.inputs.enable_cache == 'true'
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ github.event.inputs.repo_choice }}-${{ github.event.inputs.repo_branch }}-dl-${{ hashFiles('openwrt/feeds.conf.default') }}
        restore-keys: |
          ${{ github.event.inputs.repo_choice }}-${{ github.event.inputs.repo_branch }}-dl-

    - name: Parse Multiselect Plugins
      run: |
        # 默认全部初始化为 false
        INCLUDE_CLASHOO="false"
        INCLUDE_OPENCLASH="false"
        INCLUDE_PASSWALL="false"
        INCLUDE_MOSDNS="false"
        INCLUDE_ARGON="false"

        # 读取多选字符串并按空格分割解析
        read -r -a selected_plugins <<< "${{ github.event.inputs.plugin_choices }}"
        for plugin in "${selected_plugins[@]}"; do
          # 改进点：转换为小写，增强输入容错性，即使手滑输入 OpenClash / PassWall 也能被正常识别
          plugin_lower=$(echo "$plugin" | tr '[:upper:]' '[:lower:]')
          case "$plugin_lower" in
            clashoo) INCLUDE_CLASHOO="true" ;;
            openclash) INCLUDE_OPENCLASH="true" ;;
            passwall) INCLUDE_PASSWALL="true" ;;
            mosdns) INCLUDE_MOSDNS="true" ;;
            argon) INCLUDE_ARGON="true" ;;
          esac
        done
        
        # 将解析后的变量保存到全局环境变量，供接下来的编译步骤读取
        echo "INCLUDE_CLASHOO=$INCLUDE_CLASHOO" >> $GITHUB_ENV
        echo "INCLUDE_OPENCLASH=$INCLUDE_OPENCLASH" >> $GITHUB_ENV
        echo "INCLUDE_PASSWALL=$INCLUDE_PASSWALL" >> $GITHUB_ENV
        echo "INCLUDE_MOSDNS=$INCLUDE_MOSDNS" >> $GITHUB_ENV
        echo "INCLUDE_ARGON=$INCLUDE_ARGON" >> $GITHUB_ENV
        
        echo "解析完成！插件状态："
        echo "Clashoo: $INCLUDE_CLASHOO"
        echo "OpenClash: $INCLUDE_OPENCLASH"
        echo "PassWall: $INCLUDE_PASSWALL"
        echo "MosDNS: $INCLUDE_MOSDNS"
        echo "Argon主题: $INCLUDE_ARGON"

    - name: Add Third-Party Feeds Dynamically
      run: |
        cd openwrt
        # 1. 自动依赖绑定：若选择了 Kenzok8 源，或启用了 Clashoo 插件，强制绑定 kenzo 和 small 源
        if [ "${{ github.event.inputs.feed_choice }}" = "kenzok8" ] || [ "$INCLUDE_CLASHOO" = "true" ]; then
          echo "src-git kenzo https://github.com/kenzok8/openwrt-packages.git" >> feeds.conf.default
          echo "src-git small https://github.com/kenzok8/small.git" >> feeds.conf.default
        fi
        
        # 2. 自动依赖绑定：如果勾选了 PassWall，且没有开启 kenzok8，系统将自动绑定 PassWall 专属源保证依赖不报未定义错误
        if [ "$INCLUDE_PASSWALL" = "true" ] && [ "${{ github.event.inputs.feed_choice }}" != "kenzok8" ]; then
          echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git" >> feeds.conf.default
          echo "src-git passwall https://github.com/Openwrt-Passwall/openwrt-passwall.git" >> feeds.conf.default
        fi
        
        # 3. 如果勾选了 OpenClash，拉取后精准提取包文件夹以避免目录嵌套
        if [ "$INCLUDE_OPENCLASH" = "true" ]; then
          git clone --depth=1 https://github.com/vernesong/OpenClash.git /tmp/openclash
          mkdir -p package/custom
          mv /tmp/openclash/luci-app-openclash package/custom/luci-app-openclash
          rm -rf /tmp/openclash
        fi
        
        # 4. 自动根据固件源自适应拉取 MosDNS 转发器源码 (sbwml大作)
        if [ "$INCLUDE_MOSDNS" = "true" ]; then
          # 纠错和自适应逻辑：LEDE 用 v5-lua 分支，官方/天灵用标准 v5
          MOSDNS_BRANCH="v5"
          if [ "${{ github.event.inputs.repo_choice }}" = "lede" ]; then
            MOSDNS_BRANCH="v5-lua"
          fi
          git clone --depth=1 https://github.com/sbwml/luci-app-mosdns.git -b $MOSDNS_BRANCH /tmp/mosdns
          mkdir -p package/custom
          mv /tmp/mosdns/luci-app-mosdns package/custom/luci-app-mosdns
          mv /tmp/mosdns/mosdns package/custom/mosdns
          mv /tmp/mosdns/v2dat package/custom/v2dat
          rm -rf /tmp/mosdns
        fi
        
        # 5. 拉取 Argon 炫酷主题及其配置管理插件
        if [ "$INCLUDE_ARGON" = "true" ]; then
          mkdir -p package/custom
          git clone --depth=1 https://github.com/jerrykuku/luci-theme-argon.git package/custom/luci-theme-argon
          git clone --depth=1 https://github.com/jerrykuku/luci-app-argon-config.git package/custom/luci-app-argon-config
        fi

    - name: Configure Default Network & Gateway Settings
      env:
        IS_BYPASS: ${{ github.event.inputs.is_bypass_router }}
        LAN_IP: ${{ github.event.inputs.lan_ip }}
        LAN_GATEWAY: ${{ github.event.inputs.lan_gateway }}
        LAN_DNS: ${{ github.event.inputs.lan_dns }}
        ROOT_PASSWORD: ${{ github.event.inputs.root_password }}
      run: |
        mkdir -p openwrt/files/etc/uci-defaults
        cat << EOF > openwrt/files/etc/uci-defaults/99-custom-settings
        #!/bin/sh
        # 1. 设置 LAN 口 IP 地址
        uci set network.lan.ipaddr='$LAN_IP'

        # 2. 如果启用了旁路由模式，配置网关、DNS 并关闭其自带的 DHCP 服务
        if [ "$IS_BYPASS" = "true" ]; then
          # 设置上级主路由网关
          uci set network.lan.gateway='$LAN_GATEWAY'
          
          # 清除原默认 DNS 并写入自定义外部 DNS
          uci del network.lan.dns
          for dns in $LAN_DNS; do
            uci add_list network.lan.dns="\$dns"
          done
          
          # 忽略 LAN 口的 DHCP 响应（不开启 DHCP 服务，防止内网 IP 分配冲突）
          uci set dhcp.lan.ignore='1'
          
          # 禁用 IPv6 通告（防止旁路由环境下的 IPv6 分配错乱）
          uci set dhcp.lan.ra='disabled'
          uci set dhcp.lan.dhcpv6='disabled'
          uci set dhcp.lan.ndp='disabled'
        fi

        # 3. 🚀 强力网络及高并发环境调优参数（开启拥塞控制 BBR + 大幅上调连接跟踪上限限制）
        mkdir -p /etc/sysctl.d
        cat << 'SYS' > /etc/sysctl.d/90-network-opt.conf
        net.ipv4.ip_forward=1
        net.netfilter.nf_conntrack_max=65536
        net.core.default_qdisc=fq
        net.ipv4.tcp_congestion_control=bbr
        SYS

        # 4. 🚀 自定义并覆盖 root 初始账户密码
        if [ -n "$ROOT_PASSWORD" ]; then
          echo -e "$ROOT_PASSWORD\n$ROOT_PASSWORD" | passwd root
        fi

        # 5. 强制设置 LuCI 默认界面语言为中文并设置时区为上海 (CST-8)
        uci set luci.main.lang='zh_cn'
        uci commit luci
        
        uci set system.@system[0].timezone='CST-8'
        uci set system.@system[0].zonename='Asia/Shanghai'
        uci commit system

        # 6. 提交配置使其生效
        uci commit network
        uci commit dhcp
        exit 0
        EOF
        # 赋予脚本执行权限
        chmod +x openwrt/files/etc/uci-defaults/99-custom-settings

    - name: Load Feeds & Update
      run: |
        cd openwrt
        ./scripts/feeds update -a
        
        # 核心清理点：在 feeds update 后、install 前执行，强力擦除官方源中较旧的相关插件，防止覆盖本地自适应克隆包
        if [ "$INCLUDE_MOSDNS" = "true" ]; then
          rm -rf feeds/luci/applications/luci-app-mosdns
          rm -rf feeds/packages/net/mosdns
          rm -rf feeds/packages/net/v2dat
        fi
        if [ "$INCLUDE_ARGON" = "true" ]; then
          rm -rf feeds/luci/themes/luci-theme-argon
          # 核心修复点：LEDE 源码本身在特定目录下也带有原生的 luci-theme-argon，为防止两个同名包冲突引发报错，在此清除冲突源
          rm -rf package/lean/luci-theme-argon
        fi
        
        ./scripts/feeds install -a

    - name: Generate Custom Configuration File
      run: |
        cd openwrt
        # 1. 动态自适应核心配置 (支持 ARM64 与 X86_64 架构判定)
        ARCH="${{ github.event.inputs.arch_choice }}"
        CHOICE="${{ github.event.inputs.repo_choice }}"
        
        if [ "$ARCH" = "x86_64" ]; then
          # X86 64位架构核心配置
          echo "CONFIG_TARGET_x86=y" > .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_DEVICE_generic=y" >> .config
          echo "TARGET_DIR_NAME=x86/64" >> $GITHUB_ENV
          echo "FILE_PREFIX=openwrt-x86-64" >> $GITHUB_ENV
          # 为 PVE LXC 部署说明准备的架构变量
          echo "PVE_ARCH=amd64" >> $GITHUB_ENV
        elif [ "$ARCH" = "armv8" ]; then
          # ARMv8 SystemReady (armsr/armv8 - 适用于新内核物理设备，如树莓派4/5)
          echo "CONFIG_TARGET_armsr=y" > .config
          echo "CONFIG_TARGET_armsr_armv8=y" >> .config
          echo "CONFIG_TARGET_armsr_armv8_DEVICE_generic=y" >> .config
          echo "TARGET_DIR_NAME=armsr/armv8" >> $GITHUB_ENV
          echo "FILE_PREFIX=openwrt-armsr-armv8" >> $GITHUB_ENV
          echo "PVE_ARCH=arm64" >> $GITHUB_ENV
        else
          # ARM64 Virtualization (armvirt/64 - 适用于传统虚拟机、LXC 容器及部分盒子打包模板)
          echo "CONFIG_TARGET_armvirt=y" > .config
          echo "CONFIG_TARGET_armvirt_64=y" >> .config
          echo "CONFIG_TARGET_armvirt_64_Default=y" >> .config
          echo "TARGET_DIR_NAME=armvirt/64" >> $GITHUB_ENV
          echo "FILE_PREFIX=openwrt-armvirt-64" >> $GITHUB_ENV
          echo "PVE_ARCH=arm64" >> $GITHUB_ENV
        fi

        # 2. 固件输出选项配置
        FMT="${{ github.event.inputs.firmware_format }}"
        if [ "$FMT" = "both" ] || [ "$FMT" = "rootfs_only" ]; then
          echo "CONFIG_TARGET_ROOTFS_TARGZ=y" >> .config
        fi
        if [ "$FMT" = "both" ] || [ "$FMT" = "efi_only" ]; then
          echo "CONFIG_TARGET_IMAGES_GZIP=y" >> .config
        fi

        # 3. 基础插件包及简体中文包配置
        if [ "${{ github.event.inputs.include_luci }}" = "true" ]; then
          echo "CONFIG_PACKAGE_luci=y" >> .config
          # 注入简体中文相关的包与编译语言设定
          echo "CONFIG_LUCI_LANG_zh_Hans=y" >> .config
          echo "CONFIG_LUCI_LANG_zh-cn=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
        fi
        if [ "$INCLUDE_PASSWALL" = "true" ]; then
          echo "CONFIG_PACKAGE_luci-app-passwall=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y" >> .config
        fi
        if [ "$INCLUDE_OPENCLASH" = "true" ]; then
          echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-openclash-zh-cn=y" >> .config
        fi
        
        # 4. 动态写入自适应插件及 Clashoo 配套
        if [ "$INCLUDE_ARGON" = "true" ]; then
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-argon-config=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn=y" >> .config
        fi
        if [ "$INCLUDE_MOSDNS" = "true" ]; then
          echo "CONFIG_PACKAGE_luci-app-mosdns=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-mosdns-zh-cn=y" >> .config
        fi
        if [ "$INCLUDE_CLASHOO" = "true" ]; then
          echo "CONFIG_PACKAGE_luci-app-clashoo=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-clashoo-zh-cn=y" >> .config
          # 自动注入 Clashoo 所需核心依赖，防止后台缺失
          echo "CONFIG_PACKAGE_clashoo=y" >> .config
          echo "CONFIG_PACKAGE_mihomo=y" >> .config
          echo "CONFIG_PACKAGE_sing-box=y" >> .config
          echo "CONFIG_PACKAGE_yq=y" >> .config
          echo "CONFIG_PACKAGE_coreutils-nohup=y" >> .config
          echo "CONFIG_PACKAGE_ca-bundle=y" >> .config
          echo "CONFIG_PACKAGE_curl=y" >> .config
        fi

        # 5. 规避 Dnsmasq 冲突优化 (添加 Clashoo 作为条件)
        if [ "$INCLUDE_PASSWALL" = "true" ] || [ "$INCLUDE_OPENCLASH" = "true" ] || [ "$INCLUDE_MOSDNS" = "true" ] || [ "$INCLUDE_CLASHOO" = "true" ]; then
          echo "# CONFIG_PACKAGE_dnsmasq is not set" >> .config
          echo "CONFIG_PACKAGE_dnsmasq_full=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y" >> .config
        fi

        # 6. 健壮解析自定义追加包
        read -r -a pkgs <<< "${{ github.event.inputs.custom_packages }}"
        for pkg in "${pkgs[@]}"; do
          if [ -n "$pkg" ]; then
            echo "CONFIG_PACKAGE_$pkg=y" >> .config
          fi
        done

        # 7. 补全默认依赖
        make defconfig

        # 8. 核心去冲突修复点：在 make defconfig 运行后，强制使用 sed 二次干预移除 dnsmasq 默认包以防止其被强行还原写回
        if [ "$INCLUDE_PASSWALL" = "true" ] || [ "$INCLUDE_OPENCLASH" = "true" ] || [ "$INCLUDE_MOSDNS" = "true" ] || [ "$INCLUDE_CLASHOO" = "true" ]; then
          sed -i 's/CONFIG_PACKAGE_dnsmasq=y/# CONFIG_PACKAGE_dnsmasq is not set/g' .config
          sed -i 's/CONFIG_PACKAGE_dnsmasq-dhcpv6=y/# CONFIG_PACKAGE_dnsmasq-dhcpv6 is not set/g' .config
        fi

    - name: Download package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        
        # 提取 OpenWrt 编译版本号作为 Release 的标签参考
        grep 'CONFIG_VERSION_NUMBER' .config | cut -d'=' -f2 | tr -d '"' > .version
        if [ ! -s .version ]; then
          echo "custom" > .version
        fi
        echo "VERSION=$(cat .version)" >> $GITHUB_ENV

    - name: Print Build Failures
      if: failure()
      run: |
        echo "============================================="
        echo " 编译失败！正在尝试提取并展示最近编译错误的日志内容..."
        echo "============================================="
        if [ -d "openwrt/logs" ]; then
          find openwrt/logs -type f -name "*.txt" -exec echo -e "\n--- Log File: {} ---" \; -exec tail -n 100 {} \;
        else
          echo "未生成 logs 文件夹，可查看上方‘Compile the firmware’步骤输出的信息。"
        fi

    - name: Organize files & Rename
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        TARGET_PATH="openwrt/bin/targets/${{ env.TARGET_DIR_NAME }}"
        if [ -d "$TARGET_PATH" ]; then
          cd "$TARGET_PATH"
        else
          BACKUP_PATH=$(find openwrt/bin/targets/ -mindepth 2 -maxdepth 2 -type d | head -n 1)
          if [ -n "$BACKUP_PATH" ]; then
            cd "$BACKUP_PATH"
          else
            echo "错误：未发现编译输出目录！"
            exit 1
          fi
        fi

        mkdir -p $GITHUB_WORKSPACE/output
        FMT="${{ github.event.inputs.firmware_format }}"
        
        if [ "$FMT" = "both" ] || [ "$FMT" = "rootfs_only" ]; then
          ROOTFS_FILE=$(find . -maxdepth 1 -name "*rootfs.tar.gz" | head -n 1)
          if [ -n "$ROOTFS_FILE" ]; then
            cp "$ROOTFS_FILE" $GITHUB_WORKSPACE/output/${{ env.FILE_PREFIX }}-generic-rootfs.tar.gz
            echo "已打包 rootfs 并重命名"
          fi
        fi
        
        if [ "$FMT" = "both" ] || [ "$FMT" = "efi_only" ]; then
          EFI_FILE=$(find . -maxdepth 1 \( -name "*combined-efi.img.gz" -o -name "*combined.img.gz" -o -name "*efi.img.gz" -o -name "*ext4-combined.img.gz" \) | head -n 1)
          if [ -n "$EFI_FILE" ]; then
            cp "$EFI_FILE" $GITHUB_WORKSPACE/output/${{ env.FILE_PREFIX }}-generic-combined-efi.img.gz
            echo "已打包 combined-efi 镜像"
          fi
        fi
        
        if [ -z "$(ls -A $GITHUB_WORKSPACE/output)" ]; then
          echo "错误：未找到任何目标固件文件，请检查编译日志。"
          exit 1
        fi
        echo "status=success" >> $GITHUB_OUTPUT

    # 🚀 新增本地 Artifacts 高效备份功能（一旦 Release 步骤因网络波动发生超时等异常，这里依然提供 90 天物理机固件下载保障）
    - name: Upload artifacts to GitHub Actions
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.FILE_PREFIX }}-firmware
        path: output/*
        retention-days: 90

    - name: Upload firmware to GitHub Release
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ env.FILE_PREFIX }}-${{ env.VERSION }}-${{ github.run_number }}
        name: OpenWrt Build (${{ github.event.inputs.arch_choice }} - Run ${{ github.run_number }})
        body: |
          ### 构建信息 / Build Details
          - **固件架构 (Architecture)**: `${{ github.event.inputs.arch_choice }}`
          - **固件源码 (Source Code)**: `${{ github.event.inputs.repo_choice }}` (Branch: `${{ github.event.inputs.repo_branch }}`)
          - **软件包源 (Feeds)**: `${{ github.event.inputs.feed_choice }}`
          - **生成格式 (Format)**: `${{ github.event.inputs.firmware_format }}`
          - **已包含精品插件 (Selected Plugins)**: `${{ github.event.inputs.plugin_choices }}`
          - **其他自定义包 / Custom Packages**: `${{ github.event.inputs.custom_packages }}`

          ---

          ### 🚀 Proxmox VE (PVE) LXC 一键部署命令模板
          如果您在 PVE 中部署此固件的 LXC 容器，可在 PVE Shell 控制台中直接复制以下命令进行部署（可完全避免 `sequence number 7` 启动报错）：
          ```bash
          pct create <您的容器ID> /var/lib/vz/template/cache/${{ env.FILE_PREFIX }}-generic-rootfs.tar.gz \
            --arch ${{ env.PVE_ARCH }} \
            --ostype unmanaged \
            --unprivileged 0 \
            --features nesting=1 \
            --hostname openwrt \
            --cores 1 \
            --memory 256 \
            --swap 0 \
            --rootfs local-lvm:1
          ```
          *注：请在执行前将包上传至 PVE 模板目录，并将 `<您的容器ID>` 替换为未使用的数字（例如 `104`）*
        files: |
          output/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
